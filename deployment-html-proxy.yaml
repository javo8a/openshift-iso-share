apiVersion: apps/v1
kind: Deployment
metadata:
  name: html-proxy
  labels:
    app: iso-share
    component: html-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iso-share
      component: html-proxy
  template:
    metadata:
      labels:
        app: iso-share
        component: html-proxy
    spec:
      containers:
        - name: html-proxy
          image: python:3.12-alpine
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: INDEX_PATH
              value: /app/index.html
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          command:
            - python
            - /app/proxy.py
      volumes:
        - name: app
          configMap:
            name: html-proxy-index
      securityContext:
        seccompProfile:
          type: RuntimeDefault
