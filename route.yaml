apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: iso-share
  labels:
    app: iso-share
  annotations:
    # Allow long-running chunk downloads (default is 30s)
    haproxy.router.openshift.io/timeout: 600s
spec:
  to:
    kind: Service
    name: iso-share
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
  wildcardPolicy: None
