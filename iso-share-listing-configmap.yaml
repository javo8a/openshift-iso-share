apiVersion: v1
kind: ConfigMap
metadata:
  name: iso-share-listing
  labels:
    app: iso-share
data:
  server.py: |
    #!/usr/bin/env python3
    """Serves directory listing with 97MB chunk links and streams files (chunked or full)."""
    import os
    import re
    import mimetypes
    from http.server import HTTPServer, BaseHTTPRequestHandler
    from urllib.parse import unquote, urlparse

    ROOT = os.environ.get("ISO_ROOT", "/usr/share/nginx/html")
    # Use decimal MB (1000) so chunk is under 100 MB and browsers don't block (97 MiB = 101.7 MB)
    CHUNK_MB = 97
    CHUNK_SIZE = CHUNK_MB * 1000 * 1000
    PORT = int(os.environ.get("PORT", "9000"))

    def safe_path(path):
        path = unquote(path)
        if path.startswith("/"):
            path = path[1:]
        path = os.path.normpath(path)
        if path == ".":
            path = ""
        full = os.path.normpath(os.path.join(ROOT, path))
        if not full.startswith(os.path.normpath(ROOT)):
            return None
        return full

    def chunk_suffix(n):
        """Part index 1,2,3,... -> 'aa','ab','ac',... for sortable filenames."""
        n0 = n - 1
        return chr(ord("a") + n0 // 26) + chr(ord("a") + n0 % 26)

    def format_size(n):
        if n >= 1024 ** 3:
            return "%.1f GiB" % (n / 1024 ** 3)
        if n >= 1024 ** 2:
            return "%.1f MiB" % (n / 1024 ** 2)
        if n >= 1024:
            return "%.1f KiB" % (n / 1024)
        return "%d B" % n

    def html_listing(dir_path, base_path):
        try:
            entries = sorted(os.scandir(dir_path), key=lambda e: (e.is_file(), e.name.lower()))
        except OSError:
            return None
        rows = []
        if base_path:
            parent = os.path.dirname(base_path.rstrip("/"))
            rows.append(
                '<tr><td colspan="6"><a href="%s">../</a></td></tr>'
                % (parent + "/" if parent else "/")
            )
        for e in entries:
            name = e.name
            if e.is_dir():
                href = (base_path + name + "/").lstrip("/") or "/"
                if not href.startswith("/"):
                    href = "/" + href
                rows.append(
                    '<tr><td><a href="%s">%s/</a></td><td></td><td></td><td></td><td></td><td></td></tr>'
                    % (href, html_escape(name))
                )
            else:
                size = e.stat().st_size
                href_file = (base_path + name).lstrip("/") or name
                if not href_file.startswith("/"):
                    href_file = "/" + href_file
                if size > CHUNK_SIZE:
                    n_chunks = (size + CHUNK_SIZE - 1) // CHUNK_SIZE
                    chunk_links = []
                    for i in range(1, n_chunks + 1):
                        start = (i - 1) * CHUNK_SIZE
                        end = min(i * CHUNK_SIZE, size) - 1
                        chunk_links.append(
                            '<a href="%s?chunk=%d">Part %s (%s–%s)</a>'
                            % (href_file, i, chunk_suffix(i), format_size(start), format_size(end + 1))
                        )
                    chunk_cell = " | ".join(chunk_links)
                    full_link = '<a href="%s">Full file</a>' % href_file
                    dl_all_btn = (
                        '<button type="button" class="dl-all-btn" data-href="%s" data-name="%s" data-nchunks="%d">Download all chunks</button>'
                        % (html_escape(href_file), html_escape(name), n_chunks)
                    )
                    md5_val = read_md5_for_file(dir_path, name)
                    md5_cell = '<code>%s</code>' % html_escape(md5_val) if md5_val else "—"
                    rows.append(
                        '<tr><td>%s</td><td>%s</td><td>%s</td><td>%s</td><td>%s</td><td>%s</td></tr>'
                        % (html_escape(name), format_size(size), chunk_cell, full_link, dl_all_btn, md5_cell)
                    )
                else:
                    md5_val = read_md5_for_file(dir_path, name)
                    md5_cell = '<code>%s</code>' % html_escape(md5_val) if md5_val else "—"
                    rows.append(
                        '<tr><td><a href="%s">%s</a></td><td>%s</td><td></td><td></td><td></td><td>%s</td></tr>'
                        % (href_file, html_escape(name), format_size(size), md5_cell)
                    )
        return "\n".join(rows)

    def read_md5_for_file(dir_path, filename):
        """Read pre-computed MD5 from sidecar (.md5) or manifest (MD5SUMS). No hashing."""
        # Sidecar: file.iso.md5 or file.iso.MD5 (content: hash or "hash  filename")
        for ext in (".md5", ".MD5"):
            path = os.path.join(dir_path, filename + ext)
            try:
                with open(path, "r") as f:
                    line = f.readline()
                    if line:
                        m = re.match(r"([a-fA-F0-9]{32})\s", line)
                        if m:
                            return m.group(1).lower()
                        if re.match(r"^[a-fA-F0-9]{32}\s*$", line.strip()):
                            return line.strip()[:32].lower()
            except OSError:
                pass
        # Manifest: MD5SUMS or md5sum.txt in same dir ("hash  filename" or "hash *filename")
        for manifest in ("MD5SUMS", "md5sum.txt", "md5sums"):
            mpath = os.path.join(dir_path, manifest)
            try:
                with open(mpath, "r") as f:
                    for line in f:
                        m = re.match(r"([a-fA-F0-9]{32})\s+[\* ]?(.+)$", line.strip())
                        if m and m.group(2).strip() == filename:
                            return m.group(1).lower()
            except OSError:
                pass
        return None

    def html_escape(s):
        return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace('"', "&quot;")

    def safe_filename_header(name):
        """Escape for Content-Disposition filename= value."""
        return name.replace("\\", "\\\\").replace('"', '\\"')

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            path = urlparse(self.path).path.rstrip("/") or "/"
            base_path = path[1:] + "/" if path != "/" else ""
            full = safe_path(path)
            if full is None:
                self.send_error(403)
                return
            if not os.path.exists(full):
                self.send_error(404)
                return
            if os.path.isdir(full):
                table = html_listing(full, base_path)
                if table is None:
                    self.send_error(403)
                    return
                html = (
                    "<!DOCTYPE html><html><head><meta charset='utf-8'><title>Index of %s</title>"
                    "<style>body{font-family:system-ui,sans-serif} table{border-collapse:collapse}"
                    "td,th{padding:6px 12px;text-align:left} a{color:#06c} .dl-all-btn{padding:6px 12px;cursor:pointer;background:#06c;color:#fff;border:none;border-radius:4px}"
                    ".dl-all-btn:hover{background:#05a} .dl-all-btn:disabled{opacity:.6;cursor:not-allowed}"
                    "#dl-status{margin-top:12px;font-size:14px}</style></head><body>"
                    "<h1>Index of %s</h1><div id='dl-status'></div><table><tr><th>Name</th><th>Size</th><th>Chunks (97 MB)</th><th>Full</th><th>Download all</th><th>MD5</th></tr>%s</table>"
                    "<script>"
                    "document.querySelectorAll('.dl-all-btn').forEach(function(btn){"
                    "btn.onclick=function(){"
                    "var href=btn.getAttribute('data-href'), name=btn.getAttribute('data-name'), n=parseInt(btn.getAttribute('data-nchunks'),10);"
                    "if(!href||!n){return}"
                    "var status=document.getElementById('dl-status');"
                    "function setStatus(t){status.textContent=t; status.style.color='#000'}"
                    "function setErr(t){status.textContent=t; status.style.color='#c00'}"
                    "btn.disabled=true;"
                    "var parts=[];"
                    "function fetchNext(i){"
                    "if(i>n){"
                    "setStatus('Combining and saving...');"
                    "var blob=new Blob(parts);"
                    "var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;"
                    "document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);"
                    "setStatus('Done. Saved as '+name); btn.disabled=false; return;"
                    "}"
                    "setStatus('Downloading part '+i+' of '+n+'...');"
                    "fetch(href+'?chunk='+i).then(function(r){if(!r.ok)throw new Error(r.status); return r.arrayBuffer()}).then(function(buf){"
                    "parts.push(buf); fetchNext(i+1);"
                    "}).catch(function(e){setErr('Failed part '+i+': '+e.message); btn.disabled=false})"
                    "};"
                    "fetchNext(1);"
                    "};"
                    "});"
                    "</script></body></html>"
                    % (html_escape(path), html_escape(path), table)
                )
                self.send_response(200)
                self.send_header("Content-Type", "text/html; charset=utf-8")
                self.send_header("Content-Length", str(len(html.encode("utf-8"))))
                self.end_headers()
                self.wfile.write(html.encode("utf-8"))
                return
            # file
            query = urlparse(self.path).query
            chunk_param = None
            for part in query.split("&"):
                if part.startswith("chunk="):
                    try:
                        chunk_param = int(part.split("=", 1)[1].strip())
                        break
                    except ValueError:
                        pass
            try:
                size = os.path.getsize(full)
            except OSError:
                self.send_error(404)
                return
            if chunk_param is not None:
                if chunk_param < 1:
                    self.send_error(400, "Invalid chunk")
                    return
                start = (chunk_param - 1) * CHUNK_SIZE
                if start >= size:
                    self.send_error(404, "Chunk out of range")
                    return
                end = min(start + CHUNK_SIZE, size) - 1
                chunk_len = end - start + 1
                # Use 200 OK + filename so the browser saves the chunk as a file (206 can fail in Chrome)
                base_name = os.path.basename(full)
                part_filename = "%s.part%s" % (base_name, chunk_suffix(chunk_param))
                try:
                    self.send_response(200)
                    self.send_header("Content-Length", str(chunk_len))
                    self.send_header("Content-Type", "application/octet-stream")
                    self.send_header("Content-Disposition", 'attachment; filename="%s"' % safe_filename_header(part_filename))
                    self.end_headers()
                    with open(full, "rb") as f:
                        f.seek(start)
                        remaining = chunk_len
                        while remaining > 0:
                            buf = f.read(min(65536, remaining))
                            if not buf:
                                break
                            self.wfile.write(buf)
                            remaining -= len(buf)
                    self.wfile.flush()
                except (OSError, BrokenPipeError) as e:
                    if not self.wfile.closed:
                        try:
                            self.send_error(500, str(e))
                        except Exception:
                            pass
                return
            # full file: stream in 97MB chunks
            try:
                self.send_response(200)
                ct, _ = mimetypes.guess_type(full)
                self.send_header("Content-Type", ct or "application/octet-stream")
                self.send_header("Content-Disposition", "attachment")
                self.send_header("Content-Length", str(size))
                self.end_headers()
                with open(full, "rb") as f:
                    while True:
                        buf = f.read(CHUNK_SIZE)
                        if not buf:
                            break
                        self.wfile.write(buf)
                self.wfile.flush()
            except (OSError, BrokenPipeError) as e:
                if not self.wfile.closed:
                    try:
                        self.send_error(500, str(e))
                    except Exception:
                        pass
            return

        def log_message(self, format, *args):
            pass

    HTTPServer(("", PORT), Handler).serve_forever()
