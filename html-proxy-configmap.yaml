apiVersion: v1
kind: ConfigMap
metadata:
  name: html-proxy-index
  labels:
    app: iso-share
    component: html-proxy
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Web proxy</title>
      <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #1a1a2e; color: #eee; min-height: 100vh; }
        .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
        input[type="url"], input[type="text"] { flex: 1; min-width: 200px; padding: 10px 12px; border: 1px solid #444; border-radius: 6px; background: #16213e; color: #eee; font-size: 14px; }
        input::placeholder { color: #888; }
        button { padding: 10px 20px; border: none; border-radius: 6px; background: #0f3460; color: #eee; cursor: pointer; font-size: 14px; }
        button:hover { background: #133b5c; }
        #frame { width: 100%; height: calc(100vh - 56px); min-height: 400px; border: 1px solid #333; border-radius: 6px; background: #0f0f1a; }
      </style>
    </head>
    <body>
      <div class="bar">
        <input type="url" id="url" placeholder="Enter URL (e.g. https://example.com)" autocomplete="off">
        <button type="button" id="go">Go</button>
      </div>
      <iframe id="frame" title="Proxied content"></iframe>
      <script>
        var urlEl = document.getElementById('url');
        var frame = document.getElementById('frame');
        var goBtn = document.getElementById('go');
        function load() {
          var u = (urlEl.value || '').trim();
          if (!u) return;
          if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
          urlEl.value = u;
          frame.src = '/r?uri=' + encodeURIComponent(u);
        }
        goBtn.addEventListener('click', load);
        urlEl.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); load(); } });
      </script>
    </body>
    </html>
  proxy.py: |
    #!/usr/bin/env python3
    """Minimal HTTP server: serves index.html at / and proxies ?uri= at /r (runs non-root)."""
    import html
    import os
    import urllib.request
    import urllib.error
    from http.server import HTTPServer, BaseHTTPRequestHandler

    PORT = int(os.environ.get("PORT", "8080"))
    INDEX = os.environ.get("INDEX_PATH", "/app/static/index.html")

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/" or self.path == "/index.html":
                self.serve_index()
                return
            if self.path.startswith("/r?"):
                self.proxy_r()
                return
            self.send_error(404)

        def serve_index(self):
            try:
                with open(INDEX, "rb") as f:
                    data = f.read()
            except OSError:
                self.send_error(404)
                return
            self.send_response(200)
            self.send_header("Content-Type", "text/html; charset=utf-8")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def proxy_r(self):
            from urllib.parse import parse_qs, urlparse
            qs = parse_qs(urlparse(self.path).query)
            uris = qs.get("uri") or qs.get("url")
            if not uris:
                self.send_error(400, "Missing uri= or url=")
                return
            target = uris[0].strip()
            if not target.startswith(("http://", "https://")):
                target = "https://" + target
            try:
                req = urllib.request.Request(target, headers={"User-Agent": "HTML-Proxy/1.0"})
                with urllib.request.urlopen(req, timeout=30) as resp:
                    body = resp.read()
                    ct = resp.headers.get("Content-Type", "application/octet-stream")
                    self.send_response(resp.status)
                    self.send_header("Content-Type", ct)
                    self.send_header("Content-Length", str(len(body)))
                    for k, v in resp.headers.items():
                        if k.lower() in ("content-length", "transfer-encoding", "x-frame-options", "content-security-policy"):
                            continue
                        self.send_header(k, v)
                    self.end_headers()
                    self.wfile.write(body)
            except urllib.error.HTTPError as e:
                self.send_response(e.code)
                self.send_header("Content-Type", "text/plain; charset=utf-8")
                self.end_headers()
                self.wfile.write(str(e).encode("utf-8"))
            except Exception as e:
                self.send_error(502, str(e))

        def log_message(self, format, *args):
            pass

    HTTPServer(("", PORT), Handler).serve_forever()
